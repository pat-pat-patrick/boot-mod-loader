name: tests

on:
  push:
  pull_request:

jobs:
  loader-tests:
    # The loader and its test harness use Windows paths (%APPDATA%, %LOCALAPPDATA%).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Lua 5.1 bindings
        run: python -m pip install lupa
      - name: Run the loader test suite
        run: python tests/test_loader.py
